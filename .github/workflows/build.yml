name: Build CIA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          apt-get update && apt-get install -y imagemagick python3 unzip wget cmake g++ make
          wget -q https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3.tar.gz -O bt.tgz
          tar xzf bt.tgz && cd bannertool-1.2.3 && mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release && make -j4
          cp bannertool /usr/local/bin/ && cd ../..
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -O mr.zip
          unzip -o mr.zip && cp makerom /usr/local/bin/ && chmod +x /usr/local/bin/makerom
          bannertool || true
      - name: Assets
        run: |
          convert -size 48x48 xc:'#e53935' -fill white -gravity center -pointsize 30 -annotate 0 '!' icon.png
          convert -size 256x128 xc:'#e53935' -fill white -gravity center -pointsize 36 -annotate 0 'Notifier' banner.png
          python3 -c "import wave;w=wave.open('audio.wav','wb');w.setnchannels(1);w.setsampwidth(2);w.setframerate(22050);w.writeframes(b'\0\0'*22050);w.close()"
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: notifier
          path: |
            notifier.cia
            notifier.3dsx
